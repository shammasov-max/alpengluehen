name: deploy
# main -> production webroot on the VPS via rsync. Skips until DEPLOY_* secrets exist (see DEPLOY.md).
on:
  push:
    branches: [main]
concurrency: deploy-prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Styleguide guard
        run: node scripts/check.mjs
      - name: Secrets present?
        id: s
        env: { H: "${{ secrets.DEPLOY_HOST }}" }
        run: |
          if [ -z "$H" ]; then echo "::notice::DEPLOY_* secrets not set — production deploy skipped (see DEPLOY.md)"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: SSH key
        if: steps.s.outputs.ok == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: rsync
        if: steps.s.outputs.ok == 'true'
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude '.claude' --exclude 'scripts' \
            --exclude '*.md' --exclude '.htmlvalidate.json' --exclude '.gitignore' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"
